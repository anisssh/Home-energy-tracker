spring.application.name=user-service
service.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3307/home_energy_tracker
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# Flyway owns the schema (see db/migration) - Hibernate only validates entities match it
spring.jpa.hibernate.ddl-auto=validate

# Separate history table: user-service and device-service share one MySQL schema,
# so a shared flyway_schema_history would collide on version numbers (both ship a "V1").
spring.flyway.table=flyway_schema_history_user

