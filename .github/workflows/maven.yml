name: Java CI with Maven
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [user-service, device-service]
    services:
      mysql:
        image: mysql:8.3.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: home_energy_tracker
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_PASSWORD: test
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/home_energy_tracker
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client
      - name: Apply schema (user + device tables)
        if: matrix.service == 'device-service'
        run: |
          mysql -h 127.0.0.1 -uroot -ptest home_energy_tracker \
            < user-service/src/main/resources/db/migration/V1__user_table.sql
          mysql -h 127.0.0.1 -uroot -ptest home_energy_tracker \
            < device-service/src/main/resources/db/migration/V1__device_table.sql
      - name: Build and test ${{ matrix.service }}
        working-directory: ./${{ matrix.service }}
        run: mvn -B package
